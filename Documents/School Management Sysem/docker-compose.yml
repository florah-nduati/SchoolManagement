# version: '3.9'

services:
  client:
    build: ./client
    container_name: sms-client
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: "http://localhost:5000/api/auth"
    volumes:
      - ./client:/app
      - /app/node_modules
    restart: always
    depends_on:
      - server

  server:
    build: ./server
    container_name: sms-server
    working_dir: /app
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "postgresql://postgres:password@db:5432/school_db"
      PORT: "5000"
    restart: always
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    container_name: sms-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: school_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: